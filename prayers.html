       <section class="prayers">
            <h2> Prayer Requests</h2>
            <p class="prayer-intro">
                We would be honored to pray for you.
                Share your prayer requests below and our prayer team will stand with you in faith.
            </p>
            
            <div class="prayer-form">
                <form id="prayersForm">
                    <label>Name:</label>
                    <input type="text" id="name">
                    <small id="nameError"></small>
                    <label>Email (Optional):</label>
                    <input type="email" id="email">
                    <label>Prayer request</label>
                    <textarea id="request"rows="6"></textarea>
                    <small id="requestError"></small>
                    <button type="submit">Send Prayer Request</button>
                </form>
                <p id="successMessage"></p>
            </div>
        </section>
